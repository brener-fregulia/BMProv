[package]
name = "bamep-domain"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
serde = { version = "1", features = ["derive"] }
rand = "0.8"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
subtle = "2"
thiserror = "1"
